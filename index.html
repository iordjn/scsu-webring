        .huskey-svg {
            width: 60px;

        }

            display: block;
            width: 100%;
            height: auto;
        }

        .github-svg-container {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 24px;
            height: 24px;
        }

        .github-svg-container a {
            display: block;
            color: #333;
            line-height: 0;
            transition: color 0.15s ease, transform 0.15s ease;
        }

        .github-svg-container a:hover {
            color: #cc1042;
            transform: translateY(-2px);
        }

        .github-svg-container a:focus-visible {
            outline: 3px solid #cc1042;
            outline-offset: 3px;
        }

        .github-svg-container svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        .webring-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .webring-arrow {
            color: #333;
            font-size: 25px;
            font-weight: 700;
            line-height: 1;
            text-decoration: none;
            transition: color 0.15s ease, transform 0.15s ease;
        }

        .webring-arrow:hover {
            color: #cc1042;
            transform: translateY(-2px);
        }

        .webring-arrow:focus-visible {
            outline: 3px solid #cc1042;
            outline-offset: 3px;
        }

        .webring-arrow[aria-disabled="true"] {
            opacity: 0.4;
            pointer-events: none;
        }
    </style>
